<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mert Ömeroğlu — Software Developer</title>
  <desc id="desc">Anthracite and ivory animated portfolio banner.</desc>
  <style>
    .draw { stroke-dasharray: 920; stroke-dashoffset: 920; animation: draw 1.8s cubic-bezier(.2,.8,.2,1) .15s forwards; }
    .reveal { opacity: 0; transform: translateY(10px); animation: reveal .75s cubic-bezier(.2,.8,.2,1) .55s forwards; }
    .reveal2 { opacity: 0; transform: translateY(8px); animation: reveal .7s cubic-bezier(.2,.8,.2,1) .85s forwards; }
    .cursor { animation: pulse 2.2s ease-in-out 1.2s infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .draw { stroke-dashoffset: 0; animation: none; }
      .reveal, .reveal2 { opacity: 1; transform: none; animation: none; }
      .cursor { animation: none; }
    }
  </style>
  <rect width="1280" height="360" rx="24" fill="#1C1C1A"/>
  <path d="M0 54H1280M0 306H1280" stroke="#F2EBDD" stroke-opacity=".13"/>
  <path d="M96 292V70L236 230L376 70V292" class="draw" stroke="#AA8B58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 44V316M404 44V316" stroke="#F2EBDD" stroke-opacity=".14"/>
  <g class="reveal">
    <text x="454" y="164" fill="#F2EBDD" font-family="Georgia, Times New Roman, serif" font-size="67" letter-spacing="-2">Mert Ömeroğlu</text>
    <rect x="454" y="190" width="84" height="4" rx="2" fill="#AA8B58"/>
  </g>
  <g class="reveal2">
    <text x="454" y="237" fill="#D7CEC0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" letter-spacing="1.5">SOFTWARE DEVELOPER</text>
    <text x="454" y="277" fill="#9F988D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Web · Mobile · Commerce · Business software</text>
  </g>
  <circle class="cursor" cx="1187" cy="72" r="6" fill="#AA8B58"/>
  <path d="M1118 72H1170" stroke="#F2EBDD" stroke-opacity=".35"/>
</svg>
